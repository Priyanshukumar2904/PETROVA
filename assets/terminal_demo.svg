        <rect x="10" y="60" width="86" height="22" rx="1" fill="#0E0E0E" stroke="#282828" stroke-width="0.8" />
        <text x="16" y="75" fill="#CCCCCC" font-family="'JetBrains Mono', monospace" font-size="9">[Check Updates]</text>

        <rect x="104" y="60" width="86" height="22" rx="1" fill="#0E0E0E" stroke="#282828" stroke-width="0.8" />
        <text x="110" y="75" fill="#CCCCCC" font-family="'JetBrains Mono', monospace" font-size="9">[Disk Analysis]</text>

        <!-- Panel B: Tasks -->
