      <text x="740" y="20" fill="#AAAAAA" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">CPU 18%  |  RAM 23%  |  TEMP 54°C  |  BAT 100%  |  NET ↓2.4 MB/s ↑0.8 MB/s</text>
