<svg width="1000" height="620" viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="windowBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#11111b" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#181825" />
      <stop offset="100%" stop-color="#1e1e2e" />
    </linearGradient>
    <filter id="winShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Window Container with Drop Shadow -->
  <rect x="20" y="20" width="960" height="580" rx="14" fill="url(#windowBg)" stroke="#313244" stroke-width="1.5" filter="url(#winShadow)" />

  <!-- Header Bar -->
  <rect x="20" y="20" width="960" height="42" rx="14" fill="url(#headerGrad)" />
  <rect x="20" y="50" width="960" height="12" fill="url(#headerGrad)" />
  <line x1="20" y1="62" x2="980" y2="62" stroke="#313244" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="46" cy="41" r="6.5" fill="#f38ba8" />
  <circle cx="68" cy="41" r="6.5" fill="#f9e2af" />
  <circle cx="90" cy="41" r="6.5" fill="#a6e3a1" />

  <!-- Window Title -->
  <text x="500" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="13" font-weight="600" fill="#a6adc8" text-anchor="middle">
    cipher@archlinux: ~ (PETROVA Interactive Assistant)
  </text>

  <!-- Terminal Content Area -->
  <g transform="translate(45, 95)" font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace" font-size="14" xml:space="preserve">
    
    <!-- Step 1: User Launch -->
    <text x="0" y="0" fill="#89b4fa" font-weight="bold">cipher@archlinux <tspan fill="#f5c2e7">~</tspan> <tspan fill="#a6e3a1">❯</tspan> <tspan fill="#cdd6f4" font-weight="normal">petrova</tspan></text>

    <!-- Step 2: System Status Header -->
    <g transform="translate(0, 30)">
      <text x="0" y="0" fill="#89dceb" font-weight="bold">Good Afternoon, Cipher.</text>
      
      <!-- Status Table Box -->
      <g transform="translate(0, 15)">
        <rect x="0" y="0" width="870" height="85" rx="6" fill="#181825" stroke="#45475a" stroke-width="1" />
        
        <text x="20" y="24" fill="#89b4fa" font-weight="600">User Profile   <tspan fill="#a6e3a1" font-weight="bold">Cipher</tspan></text>
        <text x="20" y="46" fill="#89b4fa" font-weight="600">AI Model       <tspan fill="#89dceb">Qwen2.5-Coder-7B-Instruct</tspan></text>
        <text x="20" y="68" fill="#89b4fa" font-weight="600">AI Server      <tspan fill="#a6e3a1">ONLINE</tspan> <tspan fill="#6c7086">(llama-server @ :8080)</tspan></text>

        <text x="470" y="24" fill="#89b4fa" font-weight="600">Permissions    <tspan fill="#a6e3a1">CONFIRM</tspan></text>
        <text x="470" y="46" fill="#89b4fa" font-weight="600">Memory DB      <tspan fill="#a6e3a1">READY</tspan> <tspan fill="#6c7086">(12 items / 500 MB)</tspan></text>
        <text x="470" y="68" fill="#89b4fa" font-weight="600">Environment    <tspan fill="#6c7086">Linux 6.12.7 (x86_64)</tspan></text>
      </g>
    </g>

    <!-- Step 3: Interactive Prompt & Command Request -->
    <g transform="translate(0, 160)">
      <text x="0" y="0" fill="#00d7d7" font-weight="bold">PETROVA <tspan fill="#00ffaf">❯</tspan> <tspan fill="#cdd6f4" font-weight="normal">Check my disk usage and clean unused pacman cache</tspan></text>
    </g>

    <!-- Step 4: AI Response Streaming -->
    <g transform="translate(0, 195)">
      <text x="0" y="0" fill="#a6e3a1" font-weight="bold">PETROVA</text>
      <text x="0" y="24" fill="#cdd6f4">I'll check your disk partition metrics and clear uninstalled packages from your pacman cache:</text>

      <!-- Proposed Command Box -->
      <g transform="translate(0, 40)">
        <rect x="0" y="0" width="870" height="70" rx="6" fill="#181825" stroke="#89b4fa" stroke-width="1.5" />
        <text x="15" y="24" fill="#89b4fa" font-size="12" font-weight="bold">⚡ PROPOSED SYSTEM COMMAND</text>
        <text x="15" y="50" fill="#f9e2af" font-weight="bold">df -h / &amp;&amp; sudo pacman -Sc --noconfirm</text>
      </g>

      <!-- Execution Prompt -->
      <g transform="translate(0, 130)">
        <text x="0" y="0" fill="#89dceb">Run this command now? <tspan fill="#a6e3a1">[y/N]</tspan>: <tspan fill="#cdd6f4" font-weight="bold">y</tspan></text>
        <text x="0" y="24" fill="#6c7086">[Running: df -h / &amp;&amp; sudo pacman -Sc --noconfirm...]</text>

        <!-- Command Output Box -->
        <g transform="translate(0, 36)">
          <rect x="0" y="0" width="870" height="65" rx="6" fill="#11111b" stroke="#a6e3a1" stroke-width="1" />
          <text x="15" y="22" fill="#a6e3a1" font-size="11" font-weight="bold">OUTPUT (exit code 0 in 0.42s)</text>
          <text x="15" y="42" fill="#cdd6f4" font-size="13">Filesystem      Size  Used Avail Use% Mounted on</text>
          <text x="15" y="58" fill="#cdd6f4" font-size="13">/dev/nvme0n1p2  938G  142G  749G  16% /</text>
        </g>
      </g>
    </g>

    <!-- Step 5: Active Prompt with blinking cursor -->
    <g transform="translate(0, 455)">
      <text x="0" y="0" fill="#00d7d7" font-weight="bold">PETROVA <tspan fill="#00ffaf">❯</tspan> </text>
      <rect x="100" y="-14" width="9" height="18" fill="#00ffaf">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
      </rect>
    </g>

  </g>
</svg>
