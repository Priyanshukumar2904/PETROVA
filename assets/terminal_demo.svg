          <text x="14" y="20" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="10">PACKAGE                       OLD             NEW             SIZE</text>
          <text x="14" y="38" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="10.5">cachyos/cachyos-ananicy-rules 1:1.1.47-1      1:1.1.48-1      0.34 MiB</text>
          <text x="14" y="54" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="10.5">cachyos-extra-v3/vim          9.2.0849-1.1    9.2.1001-1.1    3.09 MiB</text>
        </g>

