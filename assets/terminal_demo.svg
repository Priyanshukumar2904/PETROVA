          <path d="M 0 0 L 234 0" stroke="#1A1A1A" stroke-width="0.8" />
          <text x="0" y="20" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="10">CPU THERMALS</text>
          <text x="180" y="20" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">54.0°C</text>

          <text x="0" y="42" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="10">BATTERY &amp; POWER</text>
