        <text x="16" y="21" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" letter-spacing="1">AI ASSISTANT</text>
        <text x="470" y="21" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="10.5">CONVERSATION #260825</text>

        <!-- User Message -->
