        <text x="14" y="22" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" letter-spacing="1">KEY SHORTCUTS</text>
        <path d="M 10 30 L 150 30" stroke="#1A1A1A" stroke-width="0.8" />

        <text x="14" y="48" fill="#AAAAAA" font-family="'JetBrains Mono', monospace" font-size="10.5">[H] Home</text>
        <text x="14" y="68" fill="#AAAAAA" font-family="'JetBrains Mono', monospace" font-size="10.5">[A] AI Chat</text>
        <text x="14" y="88" fill="#AAAAAA" font-family="'JetBrains Mono', monospace" font-size="10.5">[S] System</text>
        <text x="14" y="108" fill="#AAAAAA" font-family="'JetBrains Mono', monospace" font-size="10.5">[F] Files</text>
        <text x="14" y="128" fill="#AAAAAA" font-family="'JetBrains Mono', monospace" font-size="10.5">[T] Tasks</text>
        <text x="14" y="148" fill="#AAAAAA" font-family="'JetBrains Mono', monospace" font-size="10.5">[G] Settings</text>
        <text x="14" y="168" fill="#AAAAAA" font-family="'JetBrains Mono', monospace" font-size="10.5">[Q] Quit</text>
        <text x="14" y="194" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="9.5">Ctrl+T Terminal</text>
        <text x="14" y="210" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="9.5">Ctrl+M Memory</text>
