          <g transform="translate(0, 8)">
            <rect x="0" y="0" width="18" height="6" fill="#FFFFFF" />
            <rect x="22" y="0" width="18" height="6" fill="#FFFFFF" />
            <rect x="44" y="0" width="18" height="6" fill="#FFFFFF" />
            <rect x="66" y="0" width="18" height="6" fill="#222222" />
            <rect x="88" y="0" width="18" height="6" fill="#222222" />
            <rect x="110" y="0" width="18" height="6" fill="#222222" />
            <rect x="132" y="0" width="18" height="6" fill="#222222" />
            <rect x="154" y="0" width="18" height="6" fill="#222222" />
            <rect x="176" y="0" width="18" height="6" fill="#222222" />
            <rect x="198" y="0" width="18" height="6" fill="#222222" />
