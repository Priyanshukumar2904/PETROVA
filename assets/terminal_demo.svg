<svg width="1000" height="630" viewBox="0 0 1000 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1218" />
      <stop offset="100%" stop-color="#05080c" />
    </linearGradient>

    <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111c22" />
      <stop offset="100%" stop-color="#0c1419" />
    </linearGradient>

    <filter id="winShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <style>
      .btn-action {
        cursor: pointer;
        transition: all 0.25s ease;
      }
      .btn-action:hover rect {
        fill: #064e3b;
        stroke: #34d399;
      }
      .btn-action:active rect {
        fill: #78350f;
        stroke: #fbbf24;
      }
      .btn-action:active text {
        fill: #fef08a;
      }
      .pulse-caret {
        animation: blink 1.2s infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Window Container with Drop Shadow -->
  <rect x="20" y="20" width="960" height="590" rx="14" fill="url(#termBg)" stroke="#162920" stroke-width="1.5" filter="url(#winShadow)" />

  <!-- Header Bar -->
  <rect x="20" y="20" width="960" height="42" rx="14" fill="url(#headerBg)" />
  <rect x="20" y="50" width="960" height="12" fill="url(#headerBg)" />
  <line x1="20" y1="62" x2="980" y2="62" stroke="#162920" stroke-width="1" />

  <!-- Window Traffic Lights (Interactive Style) -->
  <circle cx="48" cy="41" r="6" fill="#f87171" />
  <circle cx="68" cy="41" r="6" fill="#fbbf24" />
  <circle cx="88" cy="41" r="6" fill="#34d399" />

  <!-- Window Title -->
  <text x="500" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="12.5" font-weight="600" fill="#94a3b8" text-anchor="middle">
    cipher@archlinux: ~ (PETROVA Interactive AI Session)
  </text>

  <!-- Terminal Content Area -->
  <g transform="translate(45, 90)" font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace" font-size="13.5" xml:space="preserve">
    
    <!-- Step 1: User Launch -->
    <text x="0" y="0" fill="#34d399" font-weight="bold">cipher@archlinux <tspan fill="#fbbf24">~</tspan> <tspan fill="#00f59b">❯</tspan> <tspan fill="#f1f5f9" font-weight="normal">petrova</tspan></text>

    <!-- Step 2: System Status Header -->
    <g transform="translate(0, 26)">
      <text x="0" y="0" fill="#a7f3d0" font-weight="bold">Good Afternoon, Cipher.</text>
      
      <!-- Status Table Box -->
      <g transform="translate(0, 14)">
        <rect x="0" y="0" width="870" height="82" rx="8" fill="#091216" stroke="#183628" stroke-width="1" />
        
        <text x="20" y="24" fill="#64748b" font-weight="600">User Profile   <tspan fill="#34d399" font-weight="bold">Cipher</tspan></text>
        <text x="20" y="46" fill="#64748b" font-weight="600">AI Model       <tspan fill="#6ee7b7">Qwen2.5-Coder-7B-Instruct</tspan></text>
        <text x="20" y="68" fill="#64748b" font-weight="600">AI Server      <tspan fill="#00f59b" font-weight="bold">ONLINE</tspan> <tspan fill="#475569">(llama-server @ :8080)</tspan></text>

        <text x="450" y="24" fill="#64748b" font-weight="600">Permissions    <tspan fill="#fbbf24" font-weight="bold">CONFIRM</tspan></text>
        <text x="450" y="46" fill="#64748b" font-weight="600">Memory DB      <tspan fill="#34d399" font-weight="bold">READY</tspan> <tspan fill="#475569">(18 items / 500 MB)</tspan></text>
        <text x="450" y="68" fill="#64748b" font-weight="600">Environment    <tspan fill="#475569">Arch Linux 6.12.7 (x86_64)</tspan></text>
      </g>
    </g>

    <!-- Step 3: Interactive Prompt & Command Request -->
    <g transform="translate(0, 150)">
      <text x="0" y="0" fill="#00f59b" font-weight="bold">PETROVA <tspan fill="#fbbf24">❯</tspan> <tspan fill="#f1f5f9" font-weight="normal">Check system thermals, memory pressure &amp; clean package cache</tspan></text>
    </g>

    <!-- Step 4: AI Response Streaming -->
    <g transform="translate(0, 185)">
      <text x="0" y="0" fill="#34d399" font-weight="bold">PETROVA</text>
      <text x="0" y="22" fill="#cbd5e1">I've analyzed your system: CPU is running at 46°C, RAM is at 34% utilization.</text>
      <text x="0" y="42" fill="#cbd5e1">Here is the safe command to clear uninstalled packages from your pacman cache:</text>

      <!-- Proposed Command Box -->
      <g transform="translate(0, 56)">
        <rect x="0" y="0" width="870" height="66" rx="8" fill="#091216" stroke="#10b981" stroke-width="1.2" />
        <text x="16" y="22" fill="#34d399" font-size="11" font-weight="bold">⚡ PROPOSED SYSTEM COMMAND</text>
        <text x="16" y="48" fill="#fbbf24" font-weight="bold">sudo pacman -Sc --noconfirm &amp;&amp; free -h</text>
      </g>

      <!-- Execution Prompt with Interactive Button -->
      <g transform="translate(0, 140)">
        <text x="0" y="0" fill="#a7f3d0">Run this command now? <tspan fill="#fbbf24">[y/N]</tspan>: <tspan fill="#f1f5f9" font-weight="bold">y</tspan></text>
        
        <!-- Output Box -->
        <g transform="translate(0, 18)">
          <rect x="0" y="0" width="870" height="68" rx="8" fill="#060c0f" stroke="#163828" stroke-width="1" />
          <text x="16" y="20" fill="#34d399" font-size="11" font-weight="bold">OUTPUT (exit code 0 in 0.38s)</text>
          <text x="16" y="38" fill="#cbd5e1" font-size="12.5">Packages to keep: All locally installed packages. Cache cleaned: 1.42 GiB freed.</text>
          <text x="16" y="54" fill="#94a3b8" font-size="12.5">Mem: Total 31Gi | Used 10.4Gi | Free 18.2Gi | Available 20.1Gi</text>
        </g>
      </g>
    </g>

    <!-- Step 5: Active Prompt with pulsing cursor -->
    <g transform="translate(0, 460)">
      <text x="0" y="0" fill="#00f59b" font-weight="bold">PETROVA <tspan fill="#fbbf24">❯</tspan> </text>
      <rect x="102" y="-13" width="8" height="17" fill="#00f59b" class="pulse-caret" />
    </g>

  </g>
</svg>
