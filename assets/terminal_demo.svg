    <rect x="0" y="0" width="1120" height="680" rx="3" fill="#000000" stroke="#333333" stroke-width="1.2" />

    <!-- 1. TOP SYSTEM BAR -->
    <rect x="0" y="0" width="1120" height="42" fill="#000000" />
    <path d="M 0 42 L 1120 42" stroke="#222222" stroke-width="1" />
    
    <text x="20" y="26" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="900" letter-spacing="2">PETROVA</text>
    <text x="96" y="26" fill="#555555" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">//</text>
    <text x="118" y="26" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="500">Personal Enhanced Terminal Reasoning &amp; Operations Virtual Assistant</text>

    <!-- Top Bar Right Info -->
    <g transform="translate(730, 10)">
      <rect x="0" y="0" width="130" height="22" rx="2" fill="#0A0A0A" stroke="#333333" stroke-width="0.8" />
      <text x="10" y="15" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">🔊 Voice: ON</text>

      <text x="145" y="16" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">[LOCK] LOCAL PRIVACY</text>
      <text x="290" y="16" fill="#555555" font-family="'JetBrains Mono', monospace" font-size="11">|</text>
      <text x="305" y="16" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">2026-08-25 01:22</text>
    </g>

    <!-- 2. LEFT NAVIGATION PANEL (x=0 to 190) -->
    <g transform="translate(0, 42)">
      <rect x="0" y="0" width="190" height="606" fill="#000000" />
      <path d="M 190 0 L 190 606" stroke="#222222" stroke-width="1" />

      <!-- Brand Logo / Sub -->
      <text x="20" y="28" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="900" letter-spacing="2">PETROVA</text>
      <text x="20" y="44" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">CYBER-HUD v0.1.0</text>
      <text x="20" y="60" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">● ONLINE</text>

      <path d="M 15 72 L 175 72" stroke="#1A1A1A" stroke-width="1" />

      <!-- Nav Items -->
      <!-- Item 1: HOME (Active) -->
      <rect x="15" y="84" width="160" height="32" rx="2" fill="#FFFFFF" />
      <text x="28" y="105" fill="#000000" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="900">⌂ HOME</text>

      <!-- Item 2: AI CHAT -->
      <rect x="15" y="122" width="160" height="30" rx="2" fill="transparent" stroke="#222222" stroke-width="0.8" />
      <text x="28" y="142" fill="#CCCCCC" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">💬 AI CHAT</text>

      <!-- Item 3: SYSTEM -->
      <rect x="15" y="158" width="160" height="30" rx="2" fill="transparent" stroke="#222222" stroke-width="0.8" />
      <text x="28" y="178" fill="#CCCCCC" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">📈 SYSTEM</text>

      <!-- Item 4: FILES -->
      <rect x="15" y="194" width="160" height="30" rx="2" fill="transparent" stroke="#222222" stroke-width="0.8" />
      <text x="28" y="214" fill="#CCCCCC" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">📁 FILES</text>

      <!-- Item 5: TASKS -->
      <rect x="15" y="230" width="160" height="30" rx="2" fill="transparent" stroke="#222222" stroke-width="0.8" />
      <text x="28" y="250" fill="#CCCCCC" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">📋 TASKS</text>

      <!-- Item 6: SETTINGS -->
