        <text x="16" y="74" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="12">Check available system updates and inspect package disk cache.</text>

        <!-- Assistant Message -->
        <text x="16" y="106" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900">[PETROVA]</text>
        <text x="16" y="125" fill="#DDDDDD" font-family="'JetBrains Mono', sans-serif" font-size="12">
          I've synchronized with your package databases. 6 packages are ready to update:
        </text>

