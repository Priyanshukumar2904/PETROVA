        <text x="224" y="20" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="800">ACTIVE TASKS</text>
        <text x="224" y="42" fill="#CCCCCC" font-family="'JetBrains Mono', monospace" font-size="9.5">● Monitoring System  Running</text>
