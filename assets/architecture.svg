<svg width="1100" height="700" viewBox="0 0 1100 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c12" />
      <stop offset="50%" stop-color="#0b131a" />
      <stop offset="100%" stop-color="#05080c" />
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="archTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f59b" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="boxBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1a22" />
      <stop offset="100%" stop-color="#080f14" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .arch-card {
        cursor: pointer;
        transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), filter 0.25s ease;
      }
      .arch-card rect.box-border {
        transition: stroke 0.25s ease, stroke-width 0.25s ease, fill 0.25s ease;
      }
      .arch-card:hover {
        transform: translateY(-3px);
        filter: drop-shadow(0 8px 16px rgba(16, 185, 129, 0.22));
      }
      .arch-card:hover rect.box-border {
        stroke: #00f59b;
        stroke-width: 1.6px;
      }
      .arch-card:active {
        transform: translateY(0px) scale(0.985);
        filter: drop-shadow(0 2px 6px rgba(245, 158, 11, 0.35));
      }
      .arch-card:active rect.box-border {
        stroke: #f59e0b;
        stroke-width: 2px;
      }

      /* Flow pulse line animation */
      .flow-line {
        stroke-dasharray: 6, 6;
        animation: flowDash 2.5s linear infinite;
      }
      @keyframes flowDash {
        to {
          stroke-dashoffset: -24;
        }
      }
    </style>
  </defs>

  <!-- Outer Frame -->
  <rect width="1100" height="700" rx="16" fill="url(#archBg)" stroke="#14261f" stroke-width="1.5" />

  <!-- Section Title & Subtitle -->
  <g transform="translate(550, 42)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="url(#archTitleGrad)" text-anchor="middle" letter-spacing="1.5">
      🏗️ HOW PETROVA WORKS: THE 4-STAGE ARCHITECTURE
    </text>
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500" fill="#94a3b8" text-anchor="middle">
      A simple, transparent look at how your requests flow from your hands to local intelligence and secure execution
    </text>
  </g>

  <!-- ==================== STAGE 1: USER INTERACTION LAYER ==================== -->
  <g transform="translate(40, 95)">
    <!-- Stage Header Pill -->
    <rect width="210" height="26" rx="6" fill="#082216" stroke="#10b981" stroke-width="1" />
    <text x="14" y="17" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#34d399">1. HOW YOU TALK TO IT</text>

    <!-- Card 1A: Desktop GUI -->
    <g class="arch-card" transform="translate(0, 36)" filter="url(#cardShadow)">
      <rect class="box-border" width="320" height="90" rx="10" fill="url(#boxBg)" stroke="#1a382a" stroke-width="1.2" />
      <text x="18" y="32" font-size="20">🖥️</text>
      <text x="48" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" fill="#00f59b">Neural Desktop GUI</text>
      <text x="18" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#94a3b8">
        <tspan x="18" dy="0">Visual synaptic canvas, real-time</tspan>
        <tspan x="18" dy="16">hardware gauges &amp; terminal drawer</tspan>
      </text>
    </g>

    <!-- Card 1B: Terminal REPL -->
    <g class="arch-card" transform="translate(350, 36)" filter="url(#cardShadow)">
      <rect class="box-border" width="320" height="90" rx="10" fill="url(#boxBg)" stroke="#1a382a" stroke-width="1.2" />
      <text x="18" y="32" font-size="20">💻</text>
      <text x="48" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" fill="#34d399">Interactive CLI / REPL</text>
      <text x="18" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#94a3b8">
        <tspan x="18" dy="0">Lightning-fast prompt shell with live</tspan>
        <tspan x="18" dy="16">token streaming &amp; full TTY pass-through</tspan>
      </text>
    </g>

    <!-- Card 1C: Voice Engine -->
    <g class="arch-card" transform="translate(700, 36)" filter="url(#cardShadow)">
      <rect class="box-border" width="320" height="90" rx="10" fill="url(#boxBg)" stroke="#1a382a" stroke-width="1.2" />
      <text x="18" y="32" font-size="20">🎙️</text>
      <text x="48" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" fill="#a3e635">Voice &amp; Speech Subsystem</text>
      <text x="18" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#94a3b8">
        <tspan x="18" dy="0">Microphone speech-to-text (Whisper)</tspan>
        <tspan x="18" dy="16">&amp; offline neural voice synthesis (Piper)</tspan>
      </text>
    </g>
  </g>

  <!-- Flow Arrows 1 -> 2 -->
  <g stroke="#10b981" stroke-width="1.5" opacity="0.8">
    <line class="flow-line" x1="200" y1="230" x2="200" y2="265" />
    <line class="flow-line" x1="550" y1="230" x2="550" y2="265" />
    <line class="flow-line" x1="900" y1="230" x2="900" y2="265" />
    <polygon points="550,270 545,260 555,260" fill="#10b981" />
  </g>

  <!-- ==================== STAGE 2: THE CENTRAL ROUTER ==================== -->
  <g transform="translate(40, 275)">
    <g class="arch-card" filter="url(#cardShadow)">
      <rect class="box-border" width="1020" height="66" rx="10" fill="#0c1820" stroke="#1c3e30" stroke-width="1.2" />
      <rect x="18" y="18" width="30" height="30" rx="6" fill="#0b291c" stroke="#10b981" stroke-width="1" />
      <text x="26" y="39" font-size="16">⚡</text>
      <text x="60" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#00f59b">2. THE CENTRAL INTELLIGENCE ROUTER</text>
      <text x="60" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#94a3b8">
        Instantly identifies your intent: Natural Language Query ➔ Local Brain • System Command ➔ Safe Executor • Objective ➔ Goal Planner
      </text>
      <rect x="880" y="20" width="120" height="26" rx="5" fill="#182c1f" stroke="#34d399" stroke-width="0.8" />
      <text x="892" y="37" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#a7f3d0">Zero-Lag Dispatch</text>
    </g>
  </g>

  <!-- Flow Arrows 2 -> 3 -->
  <g stroke="#34d399" stroke-width="1.5" opacity="0.8">
    <line class="flow-line" x1="165" y1="345" x2="165" y2="380" />
    <line class="flow-line" x1="420" y1="345" x2="420" y2="380" />
    <line class="flow-line" x1="675" y1="345" x2="675" y2="380" />
    <line class="flow-line" x1="930" y1="345" x2="930" y2="380" />
  </g>

  <!-- ==================== STAGE 3: ENGINES & SAFETY GUARDRAILS ==================== -->
  <g transform="translate(40, 385)">
    <!-- Stage Header Pill -->
    <rect width="250" height="26" rx="6" fill="#082216" stroke="#10b981" stroke-width="1" />
    <text x="14" y="17" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#34d399">3. THINKING &amp; DOING ENGINES</text>

    <!-- Card 3A: Local AI Brain -->
    <g class="arch-card" transform="translate(0, 36)" filter="url(#cardShadow)">
      <rect class="box-border" width="240" height="110" rx="10" fill="url(#boxBg)" stroke="#1a382a" stroke-width="1.2" />
      <text x="16" y="28" font-size="18">🧠</text>
      <text x="42" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#00f59b">Local AI Brain</text>
      <text x="16" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">
        <tspan x="16" dy="0">100% Offline llama-server</tspan>
        <tspan x="16" dy="16">or Ollama inference with</tspan>
        <tspan x="16" dy="16">distro-aware context.</tspan>
      </text>
      <rect x="16" y="78" width="95" height="20" rx="4" fill="#09291b" />
      <text x="22" y="92" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#34d399">GPU / CPU Ready</text>
    </g>

    <!-- Card 3B: Agentic Goal Planner -->
    <g class="arch-card" transform="translate(260, 36)" filter="url(#cardShadow)">
      <rect class="box-border" width="240" height="110" rx="10" fill="url(#boxBg)" stroke="#1a382a" stroke-width="1.2" />
      <text x="16" y="28" font-size="18">🎯</text>
      <text x="42" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#34d399">Agentic Planner</text>
      <text x="16" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">
        <tspan x="16" dy="0">Decomposes objectives</tspan>
        <tspan x="16" dy="16">into multi-step ordered</tspan>
        <tspan x="16" dy="16">execution checklists.</tspan>
      </text>
      <rect x="16" y="78" width="95" height="20" rx="4" fill="#09291b" />
      <text x="22" y="92" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#34d399">/goal Multi-Step</text>
    </g>

    <!-- Card 3C: Safety Shield & Shell -->
    <g class="arch-card" transform="translate(520, 36)" filter="url(#cardShadow)">
      <rect class="box-border" width="240" height="110" rx="10" fill="url(#boxBg)" stroke="#1a382a" stroke-width="1.2" />
      <text x="16" y="28" font-size="18">🛡️</text>
      <text x="42" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#fbbf24">Safety Guardrails</text>
      <text x="16" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">
        <tspan x="16" dy="0">Pre-execution warnings for</tspan>
        <tspan x="16" dy="16">destructive commands,</tspan>
        <tspan x="16" dy="16">sudo, and disk actions.</tspan>
      </text>
      <rect x="16" y="78" width="105" height="20" rx="4" fill="#2d1f08" />
      <text x="22" y="92" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#fbbf24">Explain-Before-Run</text>
    </g>

    <!-- Card 3D: Web & Code Inspector -->
    <g class="arch-card" transform="translate(780, 36)" filter="url(#cardShadow)">
      <rect class="box-border" width="240" height="110" rx="10" fill="url(#boxBg)" stroke="#1a382a" stroke-width="1.2" />
      <text x="16" y="28" font-size="18">🌐</text>
      <text x="42" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Web &amp; Repo Tools</text>
      <text x="16" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">
        <tspan x="16" dy="0">Zero-API web search and</tspan>
        <tspan x="16" dy="16">instant GitHub repo tree</tspan>
        <tspan x="16" dy="16">&amp; code file analysis.</tspan>
      </text>
      <rect x="16" y="78" width="95" height="20" rx="4" fill="#08283b" />
      <text x="22" y="92" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#38bdf8">GitHub + Search</text>
    </g>
  </g>

  <!-- Flow Arrows 3 -> 4 -->
  <g stroke="#10b981" stroke-width="1.5" opacity="0.8">
    <line class="flow-line" x1="550" y1="540" x2="550" y2="575" />
    <polygon points="550,578 545,568 555,568" fill="#10b981" />
  </g>

  <!-- ==================== STAGE 4: STORAGE & MEMORY VAULT ==================== -->
  <g transform="translate(40, 585)">
    <!-- Stage Header Pill -->
    <rect width="260" height="26" rx="6" fill="#082216" stroke="#10b981" stroke-width="1" />
    <text x="14" y="17" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#34d399">4. LOCAL MEMORY &amp; XDG VAULT</text>

    <!-- Bottom Storage Strip -->
    <g class="arch-card" transform="translate(0, 34)" filter="url(#cardShadow)">
      <rect class="box-border" width="1020" height="55" rx="8" fill="#0a1419" stroke="#183628" stroke-width="1.2" />
      
      <!-- Vault Item 1 -->
      <g transform="translate(20, 16)">
        <text x="0" y="16" font-size="16">💾</text>
        <text x="26" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#00f59b">Persistent SQLite DB</text>
        <text x="175" y="15" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">~/.local/share/petrova/petrova.db (Memory, preferences &amp; journals)</text>
      </g>

      <!-- Vault Item 2 -->
      <g transform="translate(680, 16)">
        <text x="0" y="16" font-size="16">⚙️</text>
        <text x="26" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#fbbf24">XDG Settings</text>
        <text x="125" y="15" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">~/.config/petrova/config.json</text>
      </g>
    </g>
  </g>

</svg>
