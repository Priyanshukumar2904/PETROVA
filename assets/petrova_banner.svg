<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="50%" stop-color="#080808" />
      <stop offset="100%" stop-color="#020202" />
    </linearGradient>

    <!-- Wireframe Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#181818" stroke-width="0.8" />
    </pattern>

    <!-- Subtle Glow Filter -->
    <filter id="whiteGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .mono-card {
        transition: transform 0.25s ease, stroke 0.25s ease;
      }
      .mono-card:hover {
        transform: translateY(-2px);
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" fill="url(#bgGrad)" />
  <rect width="1200" height="380" fill="url(#grid)" opacity="0.75" />

  <!-- Outer Wireframe Frame -->
  <rect x="20" y="20" width="1160" height="340" rx="4" fill="#050505" fill-opacity="0.9" stroke="#333333" stroke-width="1.2" />

  <!-- Top System Header Bar -->
  <path d="M 20 64 L 1180 64" stroke="#222222" stroke-width="1" />
  <circle cx="45" cy="42" r="4" fill="#FFFFFF" />
  <circle cx="62" cy="42" r="4" fill="#555555" />
  <circle cx="79" cy="42" r="4" fill="#333333" />
  <text x="105" y="46" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.5">PETROVA // V1 MONOCHROME CYBER-HUD COMMAND CENTER</text>
  <text x="1000" y="46" fill="#CCCCCC" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1">[LOCK] LOCAL • 100% PRIVATE</text>

  <!-- Central Hero Brand -->
  <g transform="translate(60, 100)">
    <!-- Brand Title -->
    <text x="0" y="55" fill="#FFFFFF" font-family="'JetBrains Mono', -apple-system, monospace" font-size="52" font-weight="900" letter-spacing="6" filter="url(#whiteGlow)">PETROVA</text>
    <text x="320" y="55" fill="#555555" font-family="'JetBrains Mono', monospace" font-size="52" font-weight="300">//</text>
    <text x="375" y="40" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="800" letter-spacing="2">AI OPERATING COMMAND CENTER</text>
    <text x="375" y="62" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500">Personal Enhanced Terminal Reasoning &amp; Operations Virtual Assistant</text>

    <!-- Description -->
    <text x="0" y="112" fill="#CCCCCC" font-family="'JetBrains Mono', sans-serif" font-size="14.5" font-weight="400">
      Engineered natively for Linux. Bridges local LLMs directly with the kernel, real-time Bash PTY execution,
    </text>
    <text x="0" y="136" fill="#CCCCCC" font-family="'JetBrains Mono', sans-serif" font-size="14.5" font-weight="400">
      hardware telemetry monitoring, hands-free voice interaction, and long-term SQLite memory vaults.
    </text>

    <!-- Monochrome Pills & Badges -->
    <g transform="translate(0, 168)">
      <!-- Badge 1 -->
      <g class="mono-card">
        <rect x="0" y="0" width="165" height="34" rx="2" fill="#0F0F0F" stroke="#444444" stroke-width="1" />
        <text x="14" y="21" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="800">⚡ BASH PTY ENGINE</text>
      </g>

      <!-- Badge 2 -->
      <g class="mono-card" transform="translate(180, 0)">
        <rect x="0" y="0" width="195" height="34" rx="2" fill="#0F0F0F" stroke="#444444" stroke-width="1" />
        <text x="14" y="21" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="800">📊 LINUX TELEMETRY</text>
      </g>

      <!-- Badge 3 -->
      <g class="mono-card" transform="translate(390, 0)">
        <rect x="0" y="0" width="180" height="34" rx="2" fill="#0F0F0F" stroke="#444444" stroke-width="1" />
        <text x="14" y="21" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="800">🎙️ HANDS-FREE VOICE</text>
      </g>

      <!-- Badge 4 -->
      <g class="mono-card" transform="translate(585, 0)">
        <rect x="0" y="0" width="185" height="34" rx="2" fill="#0F0F0F" stroke="#444444" stroke-width="1" />
        <text x="14" y="21" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="800">🧠 SQLITE MEMORY</text>
      </g>

      <!-- Badge 5 -->
      <g class="mono-card" transform="translate(785, 0)">
        <rect x="0" y="0" width="180" height="34" rx="2" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1" />
        <text x="18" y="21" fill="#000000" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="900">🛡️ 100% LOCAL &amp; OFFLINE</text>
      </g>
    </g>
  </g>

  <!-- Right Decorative Core Ring Widget -->
  <g transform="translate(1070, 190)">
    <circle cx="0" cy="0" r="60" fill="none" stroke="#222222" stroke-width="1" stroke-dasharray="4 4" />
    <circle cx="0" cy="0" r="45" fill="none" stroke="#444444" stroke-width="1.2" />
    <circle cx="0" cy="0" r="30" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="8 4" />
    <circle cx="0" cy="0" r="14" fill="#111111" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="0" cy="0" r="5" fill="#FFFFFF" />
    <text x="0" y="80" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">CORE INDICATOR</text>
  </g>
</svg>
