<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Neon Glow Accents -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00c6ff" />
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#00f2fe" flood-opacity="0.25" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)" />
  <rect width="1196" height="416" x="2" y="2" rx="18" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Grid Tech Lines -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Cybernetic Neural Circles -->
  <g opacity="0.25">
    <circle cx="1020" cy="180" r="120" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="4,8" />
    <circle cx="1020" cy="180" r="80" fill="none" stroke="#38bdf8" stroke-width="2" />
    <circle cx="1020" cy="180" r="40" fill="#00f2fe" fill-opacity="0.1" />
    <circle cx="1020" cy="180" r="8" fill="#00f2fe" />
    <line x1="940" y1="180" x2="1100" y2="180" stroke="#00f2fe" stroke-width="1.5" />
    <line x1="1020" y1="100" x2="1020" y2="260" stroke="#00f2fe" stroke-width="1.5" />
  </g>

  <!-- Status Pill -->
  <g transform="translate(80, 50)">
    <rect width="210" height="34" rx="17" fill="#0369a1" fill-opacity="0.3" stroke="#0ea5e9" stroke-width="1.5" />
    <circle cx="20" cy="17" r="5" fill="#10b981" filter="url(#glow)" />
    <text x="36" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" letter-spacing="1.5">LINUX AI ASSISTANT</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Ubuntu', sans-serif" font-size="78" font-weight="900" fill="url(#cyanGlow)" letter-spacing="4" filter="url(#shadow)">
    PETROVA
  </text>

  <!-- Subtitle Acronym -->
  <text x="82" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#94a3b8" letter-spacing="1.5">
    PERSONAL ENHANCED TERMINAL REASONING &amp; OPERATIONS VIRTUAL ASSISTANT
  </text>

  <!-- Feature Bullet Tags -->
  <g transform="translate(80, 260)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="180" height="42" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="20" y="26" font-family="monospace" font-size="14" font-weight="600" fill="#38bdf8">🔒 100% Local Inference</text>

    <!-- Tag 2 -->
    <rect x="195" y="0" width="180" height="42" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="215" y="26" font-family="monospace" font-size="14" font-weight="600" fill="#34d399">🧠 SQLite Memory DB</text>

    <!-- Tag 3 -->
    <rect x="390" y="0" width="180" height="42" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="410" y="26" font-family="monospace" font-size="14" font-weight="600" fill="#f472b6">⚡ Token Streaming</text>

    <!-- Tag 4 -->
    <rect x="585" y="0" width="180" height="42" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="605" y="26" font-family="monospace" font-size="14" font-weight="600" fill="#fbbf24">🌐 Online Repo Fetch</text>
  </g>

  <!-- Bottom Terminal Hint -->
  <g transform="translate(80, 345)">
    <text x="0" y="0" font-family="monospace" font-size="15" fill="#64748b">
      <tspan fill="#38bdf8" font-weight="bold">$ </tspan><tspan fill="#f1f5f9">petrova</tspan> <tspan fill="#64748b">— Intelligent System Diagnostics, Maintenance &amp; Terminal Automation</tspan>
    </text>
  </g>
</svg>
